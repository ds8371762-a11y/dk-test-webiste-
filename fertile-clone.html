  <script src="https://cdn.tailwindcss.com"></script>
  <script>

        extend: {
          colors: {
            forest: '#033220',
            cream: '#F5E8CE',
            sun: '#F9BD21',
            ember: '#EF4826',
            sage: '#9AA175'
          },
          fontFamily: {

            sans: ['Manrope', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            sun: '0 1px 2px rgba(3,50,32,0.25), 0 14px 28px -12px rgba(249,189,33,0.55)',
            ember: '0 1px 2px rgba(3,50,32,0.3), 0 16px 30px -14px rgba(239,72,38,0.6)'
          },
          transitionTimingFunction: {
            spring: 'cubic-bezier(0.34, 1.56, 0.64, 1)'
          }
        }
      }
    };
  </script>
  <style>
    body { background: #033220; color: #F5E8CE; -webkit-font-smoothing: antialiased; }
    .headline { font-variation-settings: "opsz" 144; letter-spacing: -0.03em; }
    .hero-glow {
      background:
        radial-gradient(40% 50% at 78% 62%, rgba(249,189,33,0.14) 0%, rgba(249,189,33,0) 70%),
        radial-gradient(55% 60% at 20% 30%, rgba(154,161,117,0.16) 0%, rgba(154,161,117,0) 70%),
        linear-gradient(180deg, #033220 0%, #022818 100%);
    }
    #blob { touch-action: none; }
  </style>
</head>
<body class="font-sans antialiased">

  <div class="hero-glow relative min-h-screen overflow-hidden">
    <div class="relative mx-auto flex min-h-screen max-w-[1600px] flex-col px-5 pb-10 sm:px-8 lg:px-12">

      <!-- Nav -->
      <header class="flex items-center justify-between py-6">
        <a href="#top" class="flex items-center gap-2 rounded-md outline-none transition-transform duration-300 ease-spring hover:scale-105 focus-visible:ring-2 focus-visible:ring-sun active:scale-95">
          <span class="grid h-8 w-8 place-items-center rounded-lg bg-ember">
            <span class="h-3.5 w-3.5 rounded-full bg-sun"></span>
          </span>
          <span class="font-display text-[22px] font-semibold text-cream">brand</span>
        </a>

        <nav aria-label="Primary">
          <ul class="hidden items-center gap-10 text-[15px] md:flex">
            <li><a href="#top" class="rounded-sm text-cream/85 transition-[color,transform] duration-300 ease-spring hover:text-cream focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sun active:scale-95">About</a></li>
            <li><a href="#top" class="rounded-sm text-cream/85 transition-[color,transform] duration-300 ease-spring hover:text-cream focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sun active:scale-95">Our Work</a></li>
            <li><a href="#top" class="rounded-sm text-cream/85 transition-[color,transform] duration-300 ease-spring hover:text-cream focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sun active:scale-95">Services</a></li>
            <li><a href="#top" class="rounded-sm text-cream/85 transition-[color,transform] duration-300 ease-spring hover:text-cream focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sun active:scale-95">Insights</a></li>
          </ul>
        </nav>

        <a href="#top" class="inline-flex items-center rounded-full bg-sun px-6 py-3 text-[15px] font-semibold text-forest shadow-sun transition-[transform,background-color,box-shadow] duration-300 ease-spring hover:-translate-y-0.5 hover:bg-[#FFC93D] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sun focus-visible:ring-offset-2 focus-visible:ring-offset-forest active:translate-y-0 active:scale-95">
          Start Now
        </a>
      </header>

      <!-- Hero -->
      <main id="top" class="relative grid flex-1 items-center gap-10 lg:grid-cols-12">

        <!-- Left: placeholder hero image -->
        <div class="relative order-2 lg:order-1 lg:col-span-5">
          <div class="relative mx-auto w-full max-w-[460px] lg:mx-0">
            <img
              src="https://placehold.co/560x720/0B4A32/F5E8CE?text=Hero+Image"
              alt="Placeholder hero image"
              width="560"
              height="720"
              class="block h-auto w-full rounded-[28px] object-cover shadow-[0_30px_60px_-30px_rgba(0,0,0,0.6)]"
            />
            <div class="absolute inset-0 rounded-[28px] bg-gradient-to-t from-forest/60 to-transparent mix-blend-multiply" aria-hidden="true"></div>
          </div>

          <div class="mt-8 max-w-[220px]">
            <p class="font-display text-[64px] font-semibold italic leading-none text-sun">40K+</p>
            <p class="mt-2 text-[15px] leading-snug text-sage">Placeholder stat<br />caption text</p>
          </div>
        </div>

        <!-- Right: headline and copy -->
        <div class="relative order-1 lg:order-2 lg:col-span-7 lg:pl-10">
          <p class="absolute -top-2 right-0 hidden max-w-[220px] text-right text-[22px] leading-snug text-cream lg:block">
            <span class="block font-display text-[48px] italic leading-none text-sun" aria-hidden="true">&ldquo;</span>
            Placeholder quote line one, line two.
          </p>

          <h1 class="headline font-display text-[clamp(56px,9.2vw,152px)] font-semibold leading-[0.95] text-cream">
            Your Big<br />
            Headline<br />
            Goes Here
          </h1>

          <p class="mt-8 max-w-[360px] text-[22px] leading-snug text-cream/90">
            Placeholder supporting copy that sits under the headline in two short lines.
          </p>

          <div class="mt-8 flex items-center gap-3">
            <a href="#top" class="group inline-flex items-center gap-3 rounded-full bg-ember py-3.5 pl-7 pr-2 text-[16px] font-semibold text-cream shadow-ember transition-[transform,background-color,box-shadow] duration-300 ease-spring hover:-translate-y-0.5 hover:bg-[#F25A37] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sun focus-visible:ring-offset-2 focus-visible:ring-offset-forest active:translate-y-0 active:scale-[0.97]">
              Call To Action
              <span class="grid h-11 w-11 place-items-center rounded-full bg-cream text-ember transition-transform duration-300 ease-spring group-hover:rotate-45" aria-hidden="true">
                <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>
              </span>
            </a>
          </div>
        </div>

      </main>

      <!-- 3D element: replaces the yellow splat in the reference -->
      <div id="blob-wrap" class="pointer-events-none absolute bottom-0 right-0 h-[220px] w-[220px] sm:h-[300px] sm:w-[300px] lg:h-[380px] lg:w-[380px]">
        <canvas id="blob" class="block h-full w-full" aria-hidden="true"></canvas>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const canvas = document.getElementById('blob');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.z = 4.2;

    const geometry = new THREE.IcosahedronGeometry(1.1, 48);
    const base = geometry.attributes.position.array.slice();
    const material = new THREE.MeshStandardMaterial({
      color: 0xF9BD21,
      emissive: 0x5a3d00,
      metalness: 0.05,
      roughness: 0.28
    });
    const blob = new THREE.Mesh(geometry, material);
    scene.add(blob);

    scene.add(new THREE.AmbientLight(0xF5E8CE, 0.9));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(2, 3, 4);
    scene.add(key);
    const rim = new THREE.PointLight(0xEF4826, 1.4, 10);
    rim.position.set(-2.5, -1.5, 2);
    scene.add(rim);

    const pointer = { x: 0, y: 0, tx: 0, ty: 0 };
    document.getElementById('blob-wrap').parentElement.addEventListener('pointermove', (e) => {
      pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
      pointer.ty = (e.clientY / window.innerHeight - 0.5) * 2;
    });

    // Vertices wobble with two travelling sine waves, so the surface reads as liquid.
    const pos = geometry.attributes.position;
    const v = new THREE.Vector3();
    const wobble = (t) => {
      for (let i = 0; i < pos.count; i++) {
        v.fromArray(base, i * 3);
        const n = 1 + 0.12 * Math.sin(v.x * 2.4 + t) * Math.cos(v.y * 2.1 - t * 0.8)
                    + 0.05 * Math.sin(v.z * 4.0 + t * 1.3);
        v.multiplyScalar(n);
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      pos.needsUpdate = true;
      geometry.computeVertexNormals();
    };

    const resize = () => {
      const { clientWidth: w, clientHeight: h } = canvas;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    };
    new ResizeObserver(resize).observe(canvas);
    resize();

    const frame = (time) => {
      const t = time * 0.001;
      pointer.x += (pointer.tx - pointer.x) * 0.05;
      pointer.y += (pointer.ty - pointer.y) * 0.05;
      blob.rotation.y = t * 0.25 + pointer.x * 0.5;
      blob.rotation.x = pointer.y * 0.4;
      wobble(t);
      renderer.render(scene, camera);
      if (!reduceMotion) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
