<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screenshots</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #F5F5F7; color: #1D1D1F; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    main { max-width: 1280px; margin: 0 auto; padding: 48px 16px 96px; }
    h1 { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
    .lede { color: #6E6E73; margin: 0 0 40px; }
    figure { margin: 0 0 40px; background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 10px 24px -12px rgba(0,0,0,0.08); }
    img { display: block; width: 100%; height: auto; border-radius: 10px; }
    figcaption { font-size: 14px; color: #6E6E73; padding: 12px 4px 0; }
    figcaption strong { color: #1D1D1F; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Screenshots</h1>
    <p class="lede">Selected captures from this session.</p>

    <figure>
      <img src="temporary%20screenshots/screenshot-2-round1.png" alt="Fertile clone, first pass" loading="lazy" />
      <figcaption><strong>Screenshot 2</strong>: Fertile clone, first pass</figcaption>
    </figure>

    <figure>
      <img src="temporary%20screenshots/screenshot-7-pricing-visible.png" alt="Pricing page with content forced visible" loading="lazy" />
      <figcaption><strong>Screenshot 7</strong>: Pricing page with content forced visible (layout check)</figcaption>
    </figure>
  </main>
</body>
</html>
